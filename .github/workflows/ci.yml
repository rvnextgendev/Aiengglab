name: Python CI
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: pip install 'SQLAlchemy>=2.0,<3' 'pgvector>=0.5,<1' 'httpx>=0.27,<1' 'pydantic-settings>=2.5,<3' 'PyJWT>=2.9,<3' 'alembic>=1.13,<2'
      - run: python -m compileall -q app tests scripts alembic
      - run: pytest -q
        env:
          JWT_SECRET: ci-test-secret-with-at-least-32-characters
          APP_ENV: test
