name: Sprint 1 reliability tests
on:
  push:
    branches: [feature/phase5-production-hardening]
  pull_request:
    paths:
      - 'app/reliability/**'
      - 'app/ai_workflows/**'
      - 'app/advanced_rag/**'
      - 'tests/**'
      - 'requirements*.txt'
      - '.github/workflows/sprint1-reliability.yml'
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-phase4.txt pytest
      - name: Syntax check
        run: python -m compileall -q app tests examples
      - name: Reliability and workflow tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_reliability.py tests/test_sprint1_failure_injection.py tests/test_sprint1_reconciliation.py tests/test_sprint1_final_controls.py tests/test_durable_workflows.py tests/test_sprint2_graph.py tests/test_sprints234.py tests/test_sprint4_costs.py tests/test_architecture_reference.py
