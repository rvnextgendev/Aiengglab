services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: arinova
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: arinova
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - arinova_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arinova -d arinova"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  arinova_pgdata:
